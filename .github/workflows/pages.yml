name: Build and deploy to GitHub Pages

# MANUAL ONLY - do not run on push.
# The WASM build is very heavy (~30-60 min of compile time per run). Running it
# on every push on a young account can trip GitHub's automated abuse filters.
# Test locally with Docker (see Dockerfile) and run this workflow by hand from
# the Actions tab only when you have a batch of changes ready to publish.
on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        run: |
          pnpm config set store-dir ~/.pnpm-store
          cd frontend && pnpm install

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install mono
        run: sudo apt-get install -y mono-devel

      - name: Build
        run: |
          cd loader && dotnet workload restore && cd ..
          make publish AOT=true OPT=false

      # Pages serves files as-is, so make sure Jekyll never touches the _framework folder.
      - run: touch frontend/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
