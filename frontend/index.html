<html lang="en">

    <link rel="icon" type="image/svg+xml" href="./grass-block.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Modded-Web</title>
  </head>
  <body>
    <div id="app">Your browser is not supported (does it have OPFS? does it have SharedArrayBuffer?)</div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
